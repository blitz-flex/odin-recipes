<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Odin Recipes</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='55%25' dominant-baseline='central' text-anchor='middle' font-size='90'%3E🍲%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <a class="skip-link" href="#recipes-container">Skip to recipes</a>

    <header class="main-header">
        <div class="header-shell">
            <div class="top-bar">
                <a href="./" class="brand" aria-label="Odin Recipes — home">
                    <span class="brand-icon" aria-hidden="true">🍳</span>
                    <span class="brand-text">Odin Recipes</span>
                </a>

                <form class="search-with-categories" role="search" aria-label="Recipe search">
                    <label for="search-input" class="visually-hidden">Search recipes</label>
                    <span class="search-field-icon" aria-hidden="true">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7"></circle>
                            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                        </svg>
                    </span>
                    <input type="search" id="search-input" class="nav-search"
                           placeholder="Search recipes…" autocomplete="off" enterkeyhint="search">
                </form>

                <nav class="header-actions" aria-label="Site actions">
                    <div class="categories-menu">
                        <button id="categories-toggle" class="categories-toggle" type="button"
                                aria-label="Filter by category" aria-expanded="false" aria-controls="category-panel"
                                aria-haspopup="menu" title="Select category">
                            <span class="cat-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                                    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                                    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                                    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                                </svg>
                            </span>
                            <span class="cat-text">Categories</span>
                            <span class="cat-chevron" aria-hidden="true">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </span>
                        </button>

                        <div id="category-panel" class="category-popover" aria-hidden="true">
                            <p class="category-popover-title">Filter by category</p>
                            <div id="dropdown-category-list" class="category-popover-list" role="menu"></div>
                        </div>
                    </div>

                    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
                        <span class="sun-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                        </span>
                        <span class="moon-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                            </svg>
                        </span>
                    </button>

                    <!-- Favorites (icon only with notification) -->
                    <button id="favorites-toggle" class="favorites-toggle" type="button"
                            aria-label="Jump to favorites" aria-pressed="false" title="Favorites">
                        <svg class="favorites-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <defs>
                                <linearGradient id="favorite-heart-gradient" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#C9A45C" />
                                    <stop offset="55%" stop-color="#8A6B2E" />
                                    <stop offset="100%" stop-color="#5C3232" />
                                </linearGradient>
                            </defs>
                            <path class="heart-fill"
                                d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" />
                            <path class="heart-stroke"
                                d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" />
                        </svg>
                        <span id="favorites-count" class="fav-count"></span>
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <div id="category-backdrop" class="category-backdrop" aria-hidden="true"></div>

    <div class="sacred-ledger" aria-hidden="true">
        <div class="sacred-ledger-inner">
            <span class="ledger-rule"></span>
            <p class="ledger-motto">🍲 From the Hearth of Wisdom</p>
            <span class="ledger-rule"></span>
        </div>
    </div>

    <section id="favorites-section" class="favorites-section" aria-label="Favorites">
        <p id="favorites-empty" class="favorites-empty">No kept recipes upon the hearth.</p>
        <div id="favorites-container" class="recipes-grid favorites-grid" aria-label="Favorite recipes"></div>
    </section>

    <div id="recipes-container" class="recipes-grid">
        <p class="ledger-loading">🍳 Gathering recipes…</p>
    </div>

    <div class="load-more-container">
        <button id="load-more-btn" class="load-more-btn">
            Load More
        </button>
    </div>

    <!-- Recipe Modal -->
    <div id="recipe-modal" class="modal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="recipe-modal-title">
            <div id="recipe-details"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
