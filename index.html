<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Odin Recipes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1 class="site-title">🍳 Odin Recipes</h1>
    
    <div class="controls-bar">
        <div class="search-container">
            <input type="text" 
                   id="search-input" 
                   placeholder="🔍 Search recipes...">
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <span class="sun-icon">🔆</span>
                <span class="moon-icon">🌙</span>
            </button>
            <button id="favorites-toggle"
                    class="favorites-toggle"
                    type="button"
                    aria-label="Jump to favorites"
                    title="Favorites">
                <span class="favorites-toggle-icon" aria-hidden="true">❤</span>
                <span id="favorites-btn-count" class="favorites-btn-count" aria-label="Favorites count">0</span>
            </button>
        </div>
        <div class="categories">
            <button class="category-btn" data-category="Dessert">🍰 Dessert</button>
            <button class="category-btn" data-category="Seafood">🐟 Seafood</button>
            <button class="category-btn" data-category="Vegetarian">🥗 Vegetarian</button>
            <button class="category-btn" data-category="Chicken">🍗 Chicken</button>
            <button class="category-btn" data-category="Pasta">🍝 Pasta</button>
            <button class="category-btn" data-category="Beef">🥩 Beef</button>
            <button class="category-btn" data-category="Pork">🐷 Pork</button>
            <button class="category-btn" data-category="Lamb">🐏 Lamb</button>
        </div>
    </div>

    <section id="favorites-section" class="favorites-section" aria-label="Favorites">
        <div class="favorites-header">
            <h2 class="favorites-title">❤️ Favorites</h2>
            <span id="favorites-count" class="favorites-count" aria-label="Favorites count">0</span>
        </div>
        <p id="favorites-empty" class="favorites-empty">No favorites yet — open a recipe and tap the heart.</p>
        <div id="favorites-container" class="recipes-grid favorites-grid" aria-label="Favorite recipes"></div>
    </section>
    
    <div id="recipes-container" class="recipes-grid">
        <p style="text-align: center;">Loading recipes...</p>
    </div>

    <div class="load-more-container">
        <button id="load-more-btn" class="load-more-btn" style="display: none;">
            Load More
        </button>
    </div>

	    <!-- Recipe Modal -->
	    <div id="recipe-modal" class="modal">
	        <div class="modal-content">
	            <span class="close">&times;</span>
	            <div id="recipe-details"></div>
	        </div>
	    </div>

    <script src="js/app.js"></script>
</body>
</html>
